[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "space-station-stc"
version = "0.0.1"
authors = [
  { name="Y.N", email="yn.coder@gmail.com" },
]
description = "STC — Standard Template Construct for Space Station"
readme = "README.md"
requires-python = ">=3.8"

classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "sqlglot>=25.0.0",
    "pydantic>=2.0.0",
	"litestar>=2.24.0"
]

[project.urls]
"Homepage" = "https://github.com/postpdm/space_station_stc"
"Bug Tracker" = "https://github.com/postpdm/space_station_stc/issues"

[tool.setuptools.packages.find]
where = ["src"]